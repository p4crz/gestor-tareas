<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Gestor de Tareas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1>Gestor de Tareas</h1>
    <p class="subtitulo" id="subtitulo">Inicia sesión para continuar</p>

    <div id="mensaje" class="mensaje oculto"></div>

    <form id="formAuth">
      <div class="campo oculto" id="campoNombre">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Tu nombre">
      </div>

      <div class="campo">
        <label for="email">Correo</label>
        <input type="email" id="email" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
      </div>

      <button type="submit" id="btnEnviar">Iniciar sesión</button>
    </form>

    <p class="cambio">
      <span id="textoCambio">¿No tienes cuenta?</span>
      <a href="#" id="linkCambio">Regístrate</a>
    </p>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
